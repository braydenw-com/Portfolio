<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Visualizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Open+Sans:wght@400;600&display=swap">
<script src="../js/p5/p5.min.js"></script>
<script src="../js/p5/p5.sound.min.js"></script>
<script src="../js/p5/p5.speech.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at center,#f2f4ff,#fff 65%);color:#1c1c1c;font-family:'Open Sans',Arial,sans-serif;overflow:hidden}
canvas{display:block}
.ui{position:fixed;inset:auto 0 24px;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.chip{pointer-events:auto;cursor:pointer;font:inherit;padding:8px 14px;border-radius:999px;border:1px solid #eae8e4;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);font-size:14px;color:#5c5c5c;transition:.3s}
.chip.hit{background:#1b4dff;color:#fff;border-color:transparent;transform:scale(1.1)}
.meter{width:min(260px,70vw);height:4px;border-radius:4px;background:#eae8e4;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:#1b4dff;transition:width .1s}
.heard{font-size:13px;color:#767676;min-height:1.2em}
#start{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);z-index:3;cursor:pointer}
#start h1{font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif;font-weight:600;color:#1c1c1c;font-size:clamp(2.2rem,7vw,4.5rem);margin:0 0 .2em;letter-spacing:-.04em}
#start p{color:#5c5c5c;margin:0 0 24px;padding:0 16px}
#start button{font:inherit;font-weight:700;padding:14px 26px;border-radius:999px;border:0;background:#1b4dff;color:#fff;cursor:pointer}
#pop{position:fixed;left:50%;top:50%;width:min(260px,50vw);transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.2,1.6,.4,1),opacity .4s;filter:drop-shadow(0 20px 40px rgba(27,77,255,.2))}
#pop.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.back{position:fixed;top:16px;left:16px;color:#5c5c5c;text-decoration:none;font-size:14px;z-index:4}
</style>
<style>
.pswitch{position:fixed;z-index:50;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid #eae8e4;backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(28,28,28,.08);font:600 13px/1 'Open Sans','Helvetica Neue',Arial,sans-serif}
.pswitch a{color:#5c5c5c;text-decoration:none;padding:8px 11px;border-radius:999px;white-space:nowrap}
.pswitch a:hover{color:#1b4dff;background:#f2f4ff}
.pswitch a[aria-current]{background:#1b4dff;color:#fff}
.pswitch .sep{width:1px;height:18px;background:#eae8e4;margin:0 2px}
@media (max-width:520px){.pswitch .lbl{display:none}}
</style>
</head>
<body>
<nav class="pswitch" aria-label="Class projects"><a href="../../uxdg-320/index.html">← <span class="lbl">All projects</span></a><span class="sep"></span><a href="../../coding-class/modern/index.html" title="Landing page">1</a><a href="../../word-clock/modern/index.html" title="Word clock">2</a><a href="../../audio-visualizer/modern/index.html" aria-current="page" title="Audio visualizer">3</a><span class="sep"></span><a href="../index.html">Original</a><a href="../../coding-class/modern/index.html" title="Next: Landing page">→</a></nav>
<div id="start"><div><h1>Make some noise</h1><p>Play the song, or turn on your mic and talk, sing or play your own music. Say “dance”, “party” or “music” for a surprise, or tap the buttons. Click anywhere to send a ripple.</p><button type="button" id="song">Play the song</button> <button type="button" id="go" style="background:#fff;color:#1b4dff;border:1px solid #1b4dff">Use my microphone</button><br><button type="button" id="demo" style="margin-top:10px;background:none;color:#1b4dff;font-weight:600">or play without a mic</button></div></div>
<img id="pop" alt="">
<div class="ui">
  <div class="heard" id="heard"></div>
  <div class="chips"><button class="chip" data-k="dance">dance</button><button class="chip" data-k="party">party</button><button class="chip" data-k="music">music</button></div>
  <button class="chip" id="toggle" hidden>Pause song</button>
  <div class="meter"><i id="level"></i></div>
</div>
<script>
const TRIGGERS={dance:["dance","move","boogie"],party:["party","fun","celebrate"],music:["music","beat","song"]};
const IMAGES={dance:"../assets/pic.png",party:"../assets/picc.png",music:"../assets/piccc.png"};
let amp,song={on:false},mic,fft,level=0,started=false,hideTimer,kick=0,ripples=[];

function setup(){
  createCanvas(windowWidth,windowHeight,WEBGL);
  mic=new p5.AudioIn();fft=new p5.FFT(0.8,256);
  document.getElementById('go').addEventListener('click',begin);
  document.getElementById('song').addEventListener('click',()=>{document.getElementById('start').remove();userStartAudio().then(startSong)});
  document.getElementById('toggle').addEventListener('click',()=>{song.on?stopSong():startSong()});
  document.getElementById('demo').addEventListener('click',()=>document.getElementById('start').remove());
  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{show(c.dataset.k);kick=1}));
}
function begin(){
  userStartAudio().then(()=>{mic.start();fft.setInput(mic);started=true});
  document.getElementById('start').remove();
  try{const rec=new p5.SpeechRec('en-US',()=>heard(rec.resultString));rec.continuous=true;rec.onEnd=()=>rec.start();rec.start()}catch(e){}
}
function heard(text){
  const said=(text||'').toLowerCase();document.getElementById('heard').textContent='“'+said+'”';
  for(const k in TRIGGERS)if(TRIGGERS[k].some(w=>said.includes(w)))return show(k);
}
function show(k){
  const pop=document.getElementById('pop');pop.src=IMAGES[k];pop.classList.add('show');
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('hit',c.dataset.k===k));
  clearTimeout(hideTimer);hideTimer=setTimeout(()=>{pop.classList.remove('show');document.querySelectorAll('.chip').forEach(c=>c.classList.remove('hit'))},2200);
}
function draw(){
  clear();
  kick*=.92;
  const move=dist(mouseX,mouseY,pmouseX,pmouseY)/60;
  const raw=(song.on?amp.getLevel()*1.6:started?mic.getLevel():0.02+0.015*sin(frameCount*.03))+min(move,.08)+kick*.1;
  level=lerp(level,min(raw*12,1.2),.15);
  document.getElementById('level').style.width=min(level*100,100)+'%';
  const spec=(started||song.on)?fft.analyze():[];
  // Spectrum ring: 64 bars around the sphere, flat on screen
  push();const ringR=min(width,height)*.34;
  for(let i=0;i<64;i++){const a=i/64*TWO_PI-HALF_PI;const v=spec.length?spec[i*2]/255:(.15+.15*noise(i*.3,frameCount*.02)+level*.5);
    stroke(lerpColor(color('#1c1c1c'),color('#1b4dff'),i/64));strokeWeight(3);
    const l=8+v*70;line(cos(a)*ringR,sin(a)*ringR,cos(a)*(ringR+l),sin(a)*(ringR+l))}
  // Click ripples
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t++;noFill();stroke(27,77,255,255-r.t*4);strokeWeight(2);circle(r.x,r.y,r.t*8);if(r.t>60)ripples.splice(i,1)}
  pop();
  orbitControl();
  rotateY(frameCount*.004);rotateX(frameCount*.003);
  const R=min(width,height)*.22*(1+level*.35),D=40;
  noFill();
  for(let i=0;i<=D;i++){
    const lat=map(i,0,D,0,PI);
    const c=lerpColor(color('#1c1c1c'),color('#1b4dff'),i/D);
    const band=spec.length?spec[floor(map(i,0,D,2,120))]/255:0;
    stroke(red(c),green(c),blue(c),140+band*115);strokeWeight(1+band*2.5);
    beginShape();
    for(let j=0;j<=D*2;j++){
      const lon=map(j,0,D*2,0,TWO_PI);
      const w=sin(lon*6+lat*5+frameCount*.08)*R*.12*(level+band*.5);
      const r=R+w;
      vertex(r*sin(lat)*cos(lon),r*sin(lat)*sin(lon),r*cos(lat));
    }
    endShape();
  }
}
function mousePressed(){if(!document.getElementById('start')&&mouseY<height-110){ripples.push({x:mouseX-width/2,y:mouseY-height/2,t:0});kick=1}}

// An original synth loop, made in code: 112 BPM, A minor, four-chord progression.
// It plays into p5's master output so the FFT and amplitude meter react to it.
const BPM=112,STEP=60/BPM/4,CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
function hz(n){return 440*Math.pow(2,(n-69)/12)}
function startSong(){
  const ac=getAudioContext(),out=p5.soundOut.input;
  if(!amp)amp=new p5.Amplitude();fft.setInput();
  song={on:true,step:0,next:ac.currentTime+.05};
  const b=document.getElementById('toggle');b.hidden=false;b.textContent='Pause song';
  const env=(node,t,a,d,peak)=>{node.gain.setValueAtTime(0,t);node.gain.linearRampToValueAtTime(peak,t+a);node.gain.exponentialRampToValueAtTime(.0001,t+a+d)};
  const voice=(type,f,t,a,d,peak,filt)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;let last=o;
    if(filt){const lp=ac.createBiquadFilter();lp.frequency.value=filt;o.connect(lp);last=lp}last.connect(g);g.connect(out);env(g,t,a,d,peak);o.start(t);o.stop(t+a+d+.05)};
  const kick=t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);o.connect(g);g.connect(out);env(g,t,.003,.3,.9);o.start(t);o.stop(t+.35)};
  const noise=(t,d,peak,hp)=>{const len=ac.sampleRate*d,buf=ac.createBuffer(1,len,ac.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=buf;f.type='highpass';f.frequency.value=hp;src.connect(f);f.connect(g);g.connect(out);env(g,t,.002,d,peak);src.start(t)};
  function sched(){
    if(!song.on)return;
    while(song.next<ac.currentTime+.15){
      const t=song.next,i=song.step%16,bar=Math.floor(song.step/16)%4,ch=CHORDS[bar];
      if(i%4===0)kick(t);
      if(i===4||i===12)noise(t,.18,.35,1500);
      if(i%2===1)noise(t,.04,.12,7000);
      if(i%4===0||i===14)voice('sawtooth',hz(ch[0]-24),t,.01,.25,.22,600);
      if(i%2===0)voice('triangle',hz(ch[(i/2)%3]+12),t,.005,.22,.13);
      if(i===0)ch.forEach(n=>voice('sine',hz(n),t,.3,STEP*14,.06));
      song.next+=STEP;song.step++;
    }
    song.timer=setTimeout(sched,25);
  }
  sched();
}
function stopSong(){song.on=false;clearTimeout(song.timer);document.getElementById('toggle').textContent='Play song'}
function windowResized(){resizeCanvas(windowWidth,windowHeight)}
</script>
</body>
</html>
