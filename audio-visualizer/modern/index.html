<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Visualizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Open+Sans:wght@400;600;700&display=swap">
<script src="../js/p5/p5.min.js"></script>
<script src="../js/p5/p5.sound.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05040a;color:#fff;font-family:'Open Sans',Arial,sans-serif;overflow:hidden}
canvas{display:block}
#start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at center,rgba(40,20,90,.6),rgba(5,4,10,.95));padding:16px}
#start h1{font:800 clamp(2.6rem,9vw,6rem)/.95 'Bricolage Grotesque',sans-serif;letter-spacing:-.04em;margin:0 0 .25em;font-variation-settings:'wdth' 80}
#start h1 span{background:linear-gradient(90deg,#ff3ea5,#ffd400,#3ef0ff,#a13eff);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:300%;animation:sheen 4s linear infinite}
@keyframes sheen{to{background-position:300%}}
#start p{color:rgba(255,255,255,.7);margin:0 0 26px}
.cta{font:700 1rem 'Open Sans';padding:15px 28px;border-radius:999px;border:0;background:#fff;color:#05040a;cursor:pointer;box-shadow:0 0 40px rgba(255,62,165,.5)}
.ghost{display:block;margin:14px auto 0;font:600 .9rem 'Open Sans';background:none;border:0;color:rgba(255,255,255,.7);text-decoration:underline;cursor:pointer}
/* The DJ deck */
.deck{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;padding:10px;border-radius:20px;background:rgba(15,12,30,.7);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);z-index:3;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 24px)}
.pad{width:clamp(64px,16vw,86px);aspect-ratio:1;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:rgba(255,255,255,.55);font:700 .78rem 'Open Sans';letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:grid;place-items:center;gap:2px;transition:.15s}
.pad i{font-style:normal;font-size:1.4rem}
.pad[aria-pressed="true"]{color:#05040a;background:var(--c);border-color:var(--c);box-shadow:0 0 24px var(--c)}
.pad.beat[aria-pressed="true"]{transform:scale(.94)}
.pad:focus-visible{outline:2px solid #fff;outline-offset:3px}
.label{position:fixed;top:max(18px,env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));font:700 12px 'Open Sans';letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);z-index:3}
.label b{color:#ff3ea5}
@media (prefers-reduced-motion:reduce){#start h1 span{animation:none}}
</style>
<style>
.pswitch{position:fixed;z-index:50;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.88);border:1px solid #eae8e4;backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(0,0,0,.15);font:600 13px/1 'Open Sans','Helvetica Neue',Arial,sans-serif}
.pswitch a,.pswitch button{color:#5c5c5c;text-decoration:none;padding:8px 11px;border-radius:999px;white-space:nowrap;border:0;background:none;font:inherit;cursor:pointer}
.pswitch a:hover,.pswitch button:hover{color:#1b4dff;background:#f2f4ff}
.pswitch a[aria-current],.pswitch button[aria-pressed="true"]{background:#1b4dff;color:#fff}
.pswitch .sep{width:1px;height:18px;background:#eae8e4;margin:0 2px}
@media (max-width:560px){.pswitch .lbl{display:none}}
/* Then / now wipe: the 2024 original sits on top, clipped to the left of the handle */
.cmp{position:fixed;inset:0;z-index:40;pointer-events:none}
.cmp[hidden]{display:none}
.cmp iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;clip-path:inset(0 calc(100% - var(--x)) 0 0);pointer-events:auto}
.cmp .handle{position:absolute;top:0;bottom:0;left:var(--x);width:44px;margin-left:-22px;cursor:ew-resize;pointer-events:auto;touch-action:none}
.cmp .handle::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.cmp .handle::after{content:"⇆";position:absolute;left:2px;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:#fff;color:#1b4dff;display:grid;place-items:center;font:700 18px sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.cmp .tag{position:absolute;top:70px;padding:6px 10px;border-radius:6px;font:700 11px 'Open Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;background:#141414;color:#fff;pointer-events:none}
.cmp .t1{left:calc(var(--x) - 92px)}.cmp .t2{left:calc(var(--x) + 14px);background:#1b4dff}
</style>
</head>
<body>
<nav class="pswitch" aria-label="Class projects"><a href="../../uxdg-320/index.html">← <span class="lbl">All projects</span></a><span class="sep"></span><a href="../../coding-class/modern/index.html" title="Landing page">1</a><a href="../../word-clock/modern/index.html" title="Word clock">2</a><a href="../../audio-visualizer/modern/index.html" aria-current="page" title="Audio visualizer">3</a><span class="sep"></span><button type="button" id="cmpbtn" aria-pressed="false">Then <span class="lbl">vs now</span></button><a href="../../coding-class/modern/index.html" title="Next: Landing page">→</a></nav>
<div class="cmp" id="cmp" hidden><iframe title="Original 2024 version"></iframe><span class="tag t1">2024</span><span class="tag t2">2026</span><div class="handle" aria-label="Drag to compare"></div></div>
<div class="label" id="label"><b>●</b> Live · 112 BPM</div>
<div id="start"><div>
  <h1>Turn the<br><span>lights down</span></h1>
  <p>A disco ball that dances to an original track. You're the DJ: switch parts on and off.</p>
  <button class="cta" id="song" type="button">Start the party</button>
  <button class="ghost" id="go" type="button">or use my microphone instead</button>
</div></div>
<div class="deck" id="deck" hidden>
  <button class="pad" data-part="drums" style="--c:#ff3ea5" aria-pressed="true"><i>◉</i>Drums</button>
  <button class="pad" data-part="bass" style="--c:#ffd400" aria-pressed="true"><i>▂</i>Bass</button>
  <button class="pad" data-part="chords" style="--c:#3ef0ff" aria-pressed="true"><i>≋</i>Chords</button>
  <button class="pad" data-part="lead" style="--c:#a13eff" aria-pressed="false"><i>✦</i>Lead</button>
  <button class="pad" data-part="drop" style="--c:#fff" aria-pressed="false"><i>⚡</i>Drop</button>
</div>
<script>
const COLORS=['#ff3ea5','#ffd400','#3ef0ff','#a13eff','#ff7a1a'];
let mic,fft,amp,mode=null,level=0,flash=0,spots=[],parts={drums:true,bass:true,chords:true,lead:false,drop:false};

function setup(){
  createCanvas(windowWidth,windowHeight,WEBGL);
  fft=new p5.FFT(0.8,256);amp=new p5.Amplitude();
  document.getElementById('song').onclick=()=>userStartAudio().then(()=>{mode='song';enter();startSong()});
  document.getElementById('go').onclick=()=>userStartAudio().then(()=>{mic=new p5.AudioIn();mic.start();fft.setInput(mic);amp.setInput(mic);mode='mic';enter();document.getElementById('deck').remove();document.getElementById('label').innerHTML='<b>●</b> Listening to your mic'});
  document.querySelectorAll('.pad').forEach(p=>p.onclick=()=>{const k=p.dataset.part;parts[k]=!parts[k];p.setAttribute('aria-pressed',parts[k]);if(k==='drop'&&parts.drop)flash=1});
}
function enter(){document.getElementById('start').remove();const d=document.getElementById('deck');if(d)d.hidden=false}

// A beat event from the song (or a loud moment from the mic) throws light spots around the room
function beat(strength){flash=max(flash,strength);for(let i=0;i<3+strength*5;i++)spots.push({a:random(TWO_PI),r:random(.25,.95),c:random(COLORS),life:1,s:random(30,90)})}

function draw(){
  background(5,4,10);
  level=lerp(level,min(amp.getLevel()*(mode==='mic'?9:4),1.2),.2);
  if(mode==='mic'&&level>.55&&frameCount%8===0)beat(level);
  const spec=mode?fft.analyze():[];
  flash*=.9;

  // Light spots on the walls, drawn flat behind the ball
  push();translate(0,0,-400);blendMode(ADD);noStroke();
  const W=width*1.4,H=height*1.4;
  for(let i=spots.length-1;i>=0;i--){const s=spots[i];s.a+=.004;s.life-=.012;
    const c=color(s.c);c.setAlpha(200*s.life);fill(c);
    ellipse(cos(s.a+frameCount*.003)*W*.5*s.r,sin(s.a*1.3)*H*.45*s.r,s.s*(1+flash),s.s*(1+flash));
    if(s.life<=0)spots.splice(i,1)}
  // Beams from the ball
  for(let i=0;i<6;i++){const a=frameCount*.01+i*TWO_PI/6;const c=color(COLORS[i%5]);c.setAlpha(18+flash*50);fill(c);
    beginShape();vertex(0,-height*.25,0);vertex(cos(a)*W,sin(a)*H,0);vertex(cos(a+.08)*W,sin(a+.08)*H,0);endShape(CLOSE)}
  blendMode(BLEND);pop();

  // Spectrum floor: a ring of bars under the ball
  push();translate(0,height*.28,0);rotateX(HALF_PI*.88);noStroke();
  for(let i=0;i<48;i++){const v=spec.length?spec[i*3]/255:0;const a=i/48*TWO_PI+frameCount*.004;
    const c=color(COLORS[i%5]);c.setAlpha(120+v*135);fill(c);
    push();translate(cos(a)*min(width,height)*.42,sin(a)*min(width,height)*.42,v*40);box(10,10,4+v*120);pop()}
  pop();

  // The disco ball: a faceted sphere whose mirror tiles sparkle with the music
  push();translate(0,-height*.04,0);
  stroke(30);line(0,-height,0,0,-min(width,height)*.2,0);
  rotateY(frameCount*.01);rotateX(.25);
  const R=min(width,height)*.17*(1+level*.15+flash*.08),LAT=14,LON=24;
  strokeWeight(.6);stroke(10);
  for(let i=0;i<LAT;i++){const t1=i/LAT*PI,t2=(i+1)/LAT*PI;
    for(let j=0;j<LON;j++){const p1=j/LON*TWO_PI,p2=(j+1)/LON*TWO_PI;
      const sp=noise(i*.7,j*.7,frameCount*.05);const lit=sp>.62-level*.25-flash*.3;
      if(lit){const c=color(COLORS[(i+j)%5]);fill(lerpColor(color(255),c,.5))}else fill(60+sp*90,60+sp*90,80+sp*100);
      beginShape();
      [[t1,p1],[t1,p2],[t2,p2],[t2,p1]].forEach(([t,p])=>vertex(R*sin(t)*cos(p),R*cos(t),R*sin(t)*sin(p)));
      endShape(CLOSE)}}
  pop();
}

// An original synth track, made in code: 112 BPM in A minor. Each part can be switched on and off from the deck.
const BPM=112,STEP=60/BPM/4,CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],LEAD=[76,74,72,71,72,74,76,79];
const hz=n=>440*Math.pow(2,(n-69)/12);let song={};
function startSong(){
  const ac=getAudioContext(),out=p5.soundOut.input;song={step:0,next:ac.currentTime+.05};
  const env=(g,t,a,d,pk)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)};
  const voice=(type,f,t,a,d,pk,lp)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;let n=o;if(lp){const fl=ac.createBiquadFilter();fl.frequency.value=lp;o.connect(fl);n=fl}n.connect(g);g.connect(out);env(g,t,a,d,pk);o.start(t);o.stop(t+a+d+.05)};
  const kick=t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);o.connect(g);g.connect(out);env(g,t,.003,.3,.9);o.start(t);o.stop(t+.35)};
  const noise=(t,d,pk,hp)=>{const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(g);g.connect(out);env(g,t,.002,d,pk);s.start(t)};
  (function sched(){
    while(song.next<ac.currentTime+.15){
      const t=song.next,i=song.step%16,bar=Math.floor(song.step/16)%4,ch=CHORDS[bar],delay=(t-ac.currentTime)*1000;
      const drop=parts.drop;
      if(parts.drums){if(i%4===0){kick(t);setTimeout(()=>beat(drop?1:.6),delay)}if(i===4||i===12)noise(t,.18,.35,1500);if(i%2===1||drop)noise(t,.04,.12,7000)}
      if(parts.bass&&(i%4===0||i===14||(drop&&i%2===0)))voice('sawtooth',hz(ch[0]-24),t,.01,.25,.22,drop?1400:600);
      if(parts.chords){if(i%2===0)voice('triangle',hz(ch[(i/2)%3]+12),t,.005,.22,.12);if(i===0)ch.forEach(n=>voice('sine',hz(n),t,.3,STEP*14,.06))}
      if(parts.lead&&i%2===0)voice('square',hz(LEAD[(song.step/2)%8]),t,.01,.18,.05,2500);
      document.querySelectorAll('.pad').forEach(p=>p.classList.toggle('beat',i%4===0));
      song.next+=STEP;song.step++}
    setTimeout(sched,25)})();
}
function mousePressed(){if(mode)beat(.8)}
function windowResized(){resizeCanvas(windowWidth,windowHeight)}
</script>
<script>
(()=>{const b=document.getElementById('cmpbtn'),c=document.getElementById('cmp'),h=c.querySelector('.handle');let on=false;
const set=x=>c.style.setProperty('--x',Math.min(Math.max(x,0),innerWidth)+'px');
b.onclick=()=>{on=!on;b.setAttribute('aria-pressed',on);if(on&&!c.querySelector('iframe').src)c.querySelector('iframe').src='../index.html';c.hidden=!on;set(innerWidth/2)};
h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);const mv=ev=>set(ev.clientX);h.addEventListener('pointermove',mv);h.addEventListener('pointerup',()=>h.removeEventListener('pointermove',mv),{once:true})});})();
</script>
</body>
</html>
