caseMesh.castShadow=true;caseMesh.receiveShadow=true;clock.add(caseMesh);
const FW=1.36,FH=FW*9/16,CLX=-.76,DPX=.78,DPW=1.3;


let ac,tickOn=false;
// ─── Split-flap board, like an airport departures sign ───
// Every character is a real flap module: a top and bottom half, and two flaps that fall over the hinge.
// When something changes, each module rattles through a few random characters before it lands.
const CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:- ',BLANK=CHARS.length-1,AW=128,AH=160;
const atlasC=document.createElement('canvas');atlasC.width=AW*CHARS.length;atlasC.height=AH;
function paintAtlas(){const g=atlasC.getContext('2d');g.clearRect(0,0,atlasC.width,AH);
  [...CHARS].forEach((ch,i)=>{const x=i*AW;
    const grd=g.createLinearGradient(0,0,0,AH);grd.addColorStop(0,'#262626');grd.addColorStop(.49,'#171717');grd.addColorStop(.51,'#121212');grd.addColorStop(1,'#1f1f1f');
    g.fillStyle=grd;g.beginPath();g.roundRect(x+3,3,AW-6,AH-6,8);g.fill();
    g.fillStyle='#f3efe4';g.font=`700 ${AH*.66}px "Helvetica Neue","Arial Narrow",Arial,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(ch,x+AW/2,AH/2+5);
    g.fillStyle='rgba(0,0,0,.85)';g.fillRect(x,AH/2-2,AW,4);g.fillStyle='rgba(255,255,255,.06)';g.fillRect(x+6,AH/2+2,AW-12,1)});
  atlas.needsUpdate=true}
const atlas=new THREE.CanvasTexture(atlasC);atlas.colorSpace=THREE.SRGBColorSpace;atlas.anisotropy=16;
const flapMat=new THREE.MeshStandardMaterial({map:atlas,emissive:'#ffffff',emissiveMap:atlas,emissiveIntensity:.9,roughness:.5,metalness:.1,side:THREE.DoubleSide});
const pinMat=new THREE.MeshStandardMaterial({color:'#0a0a0a'});
function setUV(m,c,top){const uv=m.geometry.attributes.uv,u0=c/CHARS.length,u1=(c+1)/CHARS.length,v0=top?.5:0,v1=top?1:.5;
  uv.setXY(0,u0,v1);uv.setXY(1,u1,v1);uv.setXY(2,u0,v0);uv.setXY(3,u1,v0);uv.needsUpdate=true}
const flaps=[];
function module(parent,x,y,tw,th){
  const g=new THREE.Group();g.position.set(x,y,.004);parent.add(g);
  const mk=top=>{const geo=new THREE.PlaneGeometry(tw,th/2);geo.translate(0,top?th/4:-th/4,0);const m=new THREE.Mesh(geo,flapMat);g.add(m);return m};
  const c={top:mk(true),bot:mk(false),fTop:mk(true),fBot:mk(false),cur:BLANK,queue:[],t:0,next:null};
  c.fTop.position.z=c.fBot.position.z=.0015;c.fTop.visible=c.fBot.visible=false;
  [c.top,c.bot].forEach((m,i)=>setUV(m,BLANK,i===0));
  const pin=new THREE.Mesh(new THREE.BoxGeometry(tw,.0012,.003),pinMat);pin.position.z=.002;g.add(pin);
  flaps.push(c);return c}
function setCell(c,target,spin=true){const end=c.queue.length?c.queue[c.queue.length-1]:(c.next??c.cur);if(end===target)return;
  c.queue=[];if(spin){const n=2+Math.floor(Math.random()*5);for(let k=0;k<n;k++)c.queue.push(Math.floor(Math.random()*(CHARS.length-1)))}c.queue.push(target);c.delay=Math.random()*.35}
const backMat=new THREE.MeshStandardMaterial({color:'#050505',roughness:.9});
// left: the word clock, 16 × 9
const board=new THREE.Group();board.position.set(CLX,-.06,CD/2+.004);clock.add(board);
board.add(new THREE.Mesh(new THREE.PlaneGeometry(FW,FH),backMat));
const TW=FW/16,TH=FH/9,cells=[];
for(let y=0;y<9;y++)for(let x=0;x<16;x++)cells.push(module(board,-FW/2+TW*(x+.5),FH/2-TH*(y+.5),TW*.9,TH*.92));
function setTargets(lit){cells.forEach((c,i)=>setCell(c,lit.has(i)?CHARS.indexOf(ROWS[Math.floor(i/16)][i%16]):BLANK))}
// right: departures, 7 flights × 29 characters (time, destination, gate, remarks)
const COLS={time:[0,5],dest:[6,10],gate:[17,3],note:[21,8]},DC=29,DR=7;
const dep=new THREE.Group();dep.position.set(DPX,-.06,CD/2+.004);clock.add(dep);
dep.add(new THREE.Mesh(new THREE.PlaneGeometry(DPW,FH),backMat));
const dTW=DPW/DC,dTH=FH/DR,depCells=[];
for(let y=0;y<DR;y++){depCells[y]=[];for(let x=0;x<DC;x++)depCells[y].push(module(dep,-DPW/2+dTW*(x+.5),FH/2-dTH*(y+.5),dTW*.9,dTH*.62))}
const DESTS=['SAVANNAH','AUSTIN','PITTSBURGH','NEW YORK','ATLANTA','CHICAGO','SAN DIEGO','SEATTLE','BOSTON','DENVER','LONDON','TOKYO','PARIS','MIAMI'];
const hash=k=>{let x=Math.sin(k*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function departures(min){const rows=[];let k=Math.floor((min-12)/20);
  while(rows.length<DR){const t=k*20+Math.floor(hash(k)*3)*5,d=t-min;
    if(d>-6){const delayed=hash(k+9)<.12;
      const note=d<=0?'DEPARTED':delayed?'DELAYED':d<10?'CLOSED':d<25?'BOARDING':d<35?'GO TO GATE':'ON TIME';
      const tt=((t%1440)+1440)%1440;
      rows.push({time:String(Math.floor(tt/60)).padStart(2,'0')+':'+String(tt%60).padStart(2,'0'),dest:DESTS[Math.floor(hash(k+3)*DESTS.length)],gate:'B'+(1+Math.floor(hash(k+5)*24)),note,boarding:note==='BOARDING'})}
    k++}
  return rows}
let lastDep='',flights=[];
function showDepartures(min){flights=departures(min);const key=flights.map(f=>f.time+f.note).join();if(key===lastDep)return;lastDep=key;
  flights.forEach((f,y)=>{const line=Array(DC).fill(' ');for(const c in COLS){const[x0,n]=COLS[c];[...f[c].slice(0,n)].forEach((ch,i)=>line[x0+i]=ch)}
    line.forEach((ch,x)=>setCell(depCells[y][x],Math.max(0,CHARS.indexOf(ch))))})}
const FLIP=.09;let lastClack=0;
function animateFlaps(dt){const now=performance.now();
  flaps.forEach(c=>{
    if(c.delay>0){c.delay-=dt;return}
    if(c.next==null&&c.queue.length){c.next=c.queue.shift();c.t=0;
      setUV(c.fTop,c.cur,true);setUV(c.top,c.next,true);setUV(c.fBot,c.next,false);
      c.fTop.visible=true;c.fBot.visible=false;c.fTop.rotation.x=0;
      if(ac&&tickOn&&now-lastClack>12){lastClack=now;flap()}}
    if(c.next!=null){c.t+=dt;const p=Math.min(c.t/FLIP,1);
      if(p<.5){c.fTop.rotation.x=-p*2*Math.PI/2}
      else{c.fTop.visible=false;c.fBot.visible=true;c.fBot.rotation.x=(1-(p-.5)*2)*Math.PI/2}
      if(p>=1){setUV(c.bot,c.next,false);c.cur=c.next;c.next=null;c.fBot.visible=false}}})}
// the clatter: a short, bright click of noise for each flap that falls
function flap(){const t=ac.currentTime,n=ac.sampleRate*.012,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=2500+Math.random()*1500;g.gain.value=.12;s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t)}
[-1,1].forEach(k=>{const r=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,1.6,10),new THREE.MeshStandardMaterial({color:'#2b2d31',metalness:.8,roughness:.3}));r.position.set(k*CW*.4,CH/2+.8,0);clock.add(r)});
// header strip above the flaps, like a departures board
const headTex=canvasTex(4096,180,(g,w,h)=>{g.fillStyle='#0c0c0d';g.fillRect(0,0,w,h);g.textBaseline='middle';
  const px=x=>(x+CW/2-.07)/(CW-.14)*w;
  g.fillStyle='#ffc61a';g.font='700 96px "Helvetica Neue",Arial,sans-serif';g.fillText('✈  LOCAL TIME',px(CLX-FW/2),h/2+4);
  g.fillText('DEPARTURES',px(DPX-DPW/2),h/2-30);g.fillStyle='#9a958a';g.font='600 46px "Helvetica Neue",Arial,sans-serif';
  [['TIME','time'],['DESTINATION','dest'],['GATE','gate'],['REMARKS','note']].forEach(([l,c])=>g.fillText(l,px(DPX-DPW/2+dTW*COLS[c][0]),h/2+52))});
const head=new THREE.Mesh(new THREE.PlaneGeometry(CW-.14,(CW-.14)*180/4096),new THREE.MeshStandardMaterial({map:headTex,roughness:.6}));head.position.set(0,CH/2-.06,CD/2+.003);clock.add(head);
// a seam between the two sections
const seam=new THREE.Mesh(new THREE.BoxGeometry(.012,FH+.02,.01),new THREE.MeshStandardMaterial({color:'#2a2a2c',metalness:.8,roughness:.4}));seam.position.set((CLX+FW/2+DPX-DPW/2)/2,-.06,CD/2+.006);clock.add(seam);

// Bloom makes the lit letters glow like real LEDs behind glass
const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{samples:4,type:THREE.HalfFloatType});
const composer=new THREE.EffectComposer(renderer,rt);composer.addPass(new THREE.RenderPass(scene,camera));
const ao=new THREE.GTAOPass(scene,camera,innerWidth,innerHeight);ao.blendIntensity=.85;ao.updateGtaoMaterial({radius:.35,distanceFallOff:1,thickness:1.2});composer.addPass(ao);
composer.addPass(new THREE.OutputPass());

// ─── Time of day → lighting ───
// [hour, sky, sun colour, sun strength, sun height, hemi strength, lamp strength, exposure, led]
const KEYS=[[0,'#0a1030',"#9fb4ff",.15,.4,.08,1.6,.9,'#9fc2ff'],[6,'#ffb38a','#ffb36b',1.2,.6,.25,.5,1,'#ffb35c'],[9,'#9fd0ff','#fff1d6',2.4,2.2,.4,0,1.1,'#ffe9b0'],
  [13,'#7ec3ff','#fffaf0',2.6,3.4,.45,0,1.1,'#fff3cc'],[17,'#ffc38a','#ffa05c',2,1.4,.35,.2,1.05,'#ffb35c'],[19.5,'#d97a6a','#ff6a3c',.9,.5,.2,1.2,1,'#ffc07a'],[22,'#1b2148','#8fa5ff',.2,.4,.1,1.8,.9,'#ffcf8a'],[24,'#0a1030',"#9fb4ff",.15,.4,.08,1.6,.9,'#9fc2ff']];
const C=new THREE.Color(),C2=new THREE.Color();
const lerpC=(a,b,t)=>C.set(a).lerp(C2.set(b),t).getStyle();
// the sun's height through the day: below the horizon at night, highest just after noon; it rises behind-left
function placeSun(h){const el=Math.sin((h-6.3)/12.4*Math.PI)*58,az=-160+(h-6)*4;
  sunDir.setFromSphericalCoords(1,THREE.MathUtils.degToRad(90-el),THREE.MathUtils.degToRad(az));su.sunPosition.value.copy(sunDir);
  su.rayleigh.value=el<8?3:1.6;sun.position.copy(sunDir).multiplyScalar(25).add(sun.target.position);if(sun.position.y<.5)sun.position.y=.5}
function light(h){let i=0;while(KEYS[i+1][0]<=h)i++;const a=KEYS[i],b=KEYS[i+1],t=(h-a[0])/(b[0]-a[0]),L=(k)=>a[k]+(b[k]-a[k])*t;
  placeSun(h);edgeMat.color.set(L(3)<.8?'#3fa9ff':'#1d3550');sun.color.set(lerpC(a[2],b[2],t));sun.intensity=L(3)*2.2;
  hemi.intensity=L(5)*3;lamp.intensity=L(6)*6;renderer.toneMappingExposure=L(7)*.5;
  }

// ─── Clock state, controls and sound (same behaviour as before) ───
let override=null,last='',playing=null;
function click(f,v){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.05)}
function update(){const d=new Date(),h=override??(d.getHours()+d.getMinutes()/60),H=Math.floor(h)%24,M=Math.floor((h%1)*60);
  light(h%24);const on=words(H,M),key=on.join();
  if(key!==last){last=key;const lit=new Set();on.forEach(k=>{const[y,x,n]=W[k];for(let i=0;i<n;i++)lit.add(y*16+x+i)});setTargets(lit)}
  showDepartures(H*60+M);document.getElementById('readout').textContent=(H%12||12)+':'+String(M).padStart(2,'0')+(H<12?' AM':' PM')}
setInterval(()=>{if(!playing)update()},1000);
document.getElementById('tick').onclick=e=>{ac=ac||new AudioContext();ac.resume();sound=tickOn=!tickOn;e.target.setAttribute('aria-pressed',tickOn);if(sound)startAmbience();else if(ambience){ambience.stop();ambience=null}};
document.getElementById('now').onclick=()=>{stop();override=null;update()};
function stop(){cancelAnimationFrame(playing);playing=null;document.getElementById('play').textContent='▶ Play a day in 20 seconds'}
document.getElementById('play').onclick=()=>{if(playing){stop();return}const s=performance.now(),h0=override??new Date().getHours();document.getElementById('play').textContent='❚❚ Pause';
  const step=t=>{override=(h0+(t-s)/20000*24)%24;update();playing=requestAnimationFrame(step)};playing=requestAnimationFrame(step)};
// Drag horizontally anywhere on the scene to scrub through the day; the camera also drifts with the pointer
let dragging=false,px=0,py=0;const el=renderer.domElement;el.style.touchAction='none';el.style.cursor='ew-resize';
const at=e=>{override=Math.min(Math.max(e.clientX/innerWidth,0),.999)*24;update()};
el.addEventListener('pointerdown',e=>{stop();dragging=true;el.setPointerCapture(e.pointerId);at(e)});
el.addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5;if(dragging)at(e)});
el.addEventListener('pointerup',()=>dragging=false);


// ─── The jet: every 30 seconds it rolls in from the left and climbs out to the right ───
const JETP=new URLSearchParams(location.search).get('jet'); // ?jet=0.3 freezes the takeoff at a point, for checking the model
function flyJet(t){const p=JETP?+JETP:(t/1000%30)/30;jet.visible=p<.6;if(!jet.visible){jet.rumbled=false;return}const k=p/.6;
  const lift=Math.max(0,k-.38);jet.position.set(-30+k*60,-.65+lift*lift*40,-14);jet.rotation.z=Math.min(lift*1.6,.2);gear.scale.y=Math.max(0,1-Math.max(0,k-.5)*6);gear.visible=gear.scale.y>.02;
  beacon.visible=Math.floor(t/600)%2===0;
  if(!jet.rumbled&&k>.15&&sound){jet.rumbled=true;rumble()}}

// ─── Airport sound: the murmur of the terminal, a PA chime now and then, jets, and the flaps ───
let sound=false,ambience=null;
function noiseBuf(sec,brown){const n=ac.sampleRate*sec,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return b}
function startAmbience(){const out=ac.createGain();out.gain.value=0;out.connect(ac.destination);out.gain.linearRampToValueAtTime(1,ac.currentTime+2);
  // crowd murmur: brown noise shaped into the voice band, with a slow swell
  const src=ac.createBufferSource();src.buffer=noiseBuf(6,true);src.loop=true;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.7;const g=ac.createGain();g.gain.value=.22;
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.13;lg.gain.value=.08;lfo.connect(lg);lg.connect(g.gain);lfo.start();
  src.connect(bp);bp.connect(g);g.connect(out);src.start();
  // air handling hum
  const hum=ac.createBufferSource();hum.buffer=noiseBuf(4,true);hum.loop=true;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=120;const hg=ac.createGain();hg.gain.value=.25;hum.connect(lp);lp.connect(hg);hg.connect(out);hum.start();
  // the PA chime: three soft descending tones, every 25 seconds
  const chime=()=>{const t=ac.currentTime+.1;[784,659,523].forEach((f,i)=>{const o=ac.createOscillator(),og=ac.createGain(),o2=ac.createOscillator();o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
    og.gain.setValueAtTime(0,t+i*.55);og.gain.linearRampToValueAtTime(.12,t+i*.55+.02);og.gain.exponentialRampToValueAtTime(.0001,t+i*.55+1.8);o.connect(og);o2.connect(og);og.connect(out);o.start(t+i*.55);o2.start(t+i*.55);o.stop(t+i*.55+1.9);o2.stop(t+i*.55+1.9)})};
  const announce=()=>{chime();const f=flights.find(f=>f.boarding)||flights.find(f=>f.note==='ON TIME');if(!f||!window.speechSynthesis)return;
    const u=new SpeechSynthesisUtterance(`Attention please. Flight U X ${320+DESTS.indexOf(f.dest)} to ${f.dest.toLowerCase()} ${f.boarding?'is now boarding':'will be boarding shortly'} at gate ${f.gate.split('').join(' ')}.`);
    u.rate=.92;u.pitch=.95;u.volume=.8;setTimeout(()=>speechSynthesis.speak(u),1900)};
  announce();const timer=setInterval(announce,30000);
  ambience={out,stop(){out.gain.linearRampToValueAtTime(0,ac.currentTime+.6);window.speechSynthesis&&speechSynthesis.cancel();clearInterval(timer);setTimeout(()=>{src.stop();hum.stop();lfo.stop();out.disconnect()},800)}}}
function rumble(){const t=ac.currentTime,src=ac.createBufferSource();src.buffer=noiseBuf(9,true);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(200,t);lp.frequency.linearRampToValueAtTime(900,t+4);lp.frequency.linearRampToValueAtTime(250,t+9);
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+3.5);g.gain.linearRampToValueAtTime(0,t+9);src.connect(lp);lp.connect(g);g.connect(ac.destination);src.start(t)}

function resize(){const a=innerWidth/innerHeight;camera.aspect=a;camera.fov=a<1?52:34;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);ao.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);resize();
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cam=new THREE.Vector3(.15,.3,5.3);
function loop(t){
  const z=innerWidth<innerHeight?9.5:5.3;
  const tx=still?0:px*.6+Math.sin(t*.00015)*.12,ty=still?.3:.3-py*.3;
  cam.x+=(tx-cam.x)*.04;cam.y+=(ty-cam.y)*.04;cam.z+=(z-cam.z)*.04;
  camera.position.copy(cam);camera.lookAt(0,.45,0);
  clock.rotation.z=still?0:Math.sin(t*.0007)*.004; // the faintest sway on its wire
  const dt=Math.min((t-(loop.last||t))/1000,.05);loop.last=t;animateFlaps(dt);flyJet(t);composer.render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
update();
paintAtlas();document.fonts&&document.fonts.ready.then(paintAtlas);
</script>
<script>
(()=>{const b=document.getElementById('cmpbtn'),c=document.getElementById('cmp'),h=c.querySelector('.handle');let on=false;
const set=x=>c.style.setProperty('--x',Math.min(Math.max(x,0),innerWidth)+'px');
b.onclick=()=>{on=!on;b.setAttribute('aria-pressed',on);if(on&&!c.querySelector('iframe').src)c.querySelector('iframe').src='../index.html';c.hidden=!on;set(innerWidth/2)};
h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);const mv=ev=>set(ev.clientX);h.addEventListener('pointermove',mv);h.addEventListener('pointerup',()=>h.removeEventListener('pointermove',mv),{once:true})});})();
</script>
