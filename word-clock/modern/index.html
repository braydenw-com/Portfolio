<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#07060d;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;filter:blur(60px) saturate(1.3);opacity:.75}
.face{position:relative;padding:clamp(18px,4vmin,40px);border-radius:28px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(16,1fr);gap:clamp(2px,1vmin,10px)}
.grid span{width:clamp(16px,5vmin,48px);aspect-ratio:1;display:grid;place-items:center;font-weight:700;font-size:clamp(11px,3vmin,26px);color:rgba(255,255,255,.13);transition:color .8s,text-shadow .8s,transform .8s}
.grid span.on{color:#fff;text-shadow:0 0 12px var(--c1),0 0 28px var(--c2);transform:scale(1.08)}
.readout{margin-top:clamp(14px,3vmin,24px);text-align:center;font-size:clamp(12px,2vmin,15px);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.back{position:fixed;top:16px;left:16px;color:rgba(255,255,255,.6);text-decoration:none;font-size:14px;z-index:2}
.back:hover{color:#fff}
@media (prefers-reduced-motion:reduce){.grid span{transition:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<a class="back" href="../">← Original</a>
<div class="face"><div class="grid" id="grid"></div><div class="readout" id="readout"></div></div>
<script>
const ROWS=["ITAISBTENTWENTYC","THIRTYFORTYFIFTY","PASTDTOETWONEFNI","THREEFOURFIVESIX","SEVENINEIGHTENRE","ELEVENTWELVEBROI","MIDNIGHTIINITHEM","MORNINGAFTERNOON","EVENINGNIGHTEBCT"];
// [row, start column, length]
const W={IT:[0,0,2],IS:[0,3,2],M10:[0,6,3],M20:[0,9,6],M30:[1,0,6],M40:[1,6,5],M50:[1,11,5],PAST:[2,0,4],
H1:[2,10,3],H2:[2,8,3],H3:[3,0,5],H4:[3,5,4],H5:[3,9,4],H6:[3,13,3],H7:[4,0,5],H8:[4,7,5],H9:[4,4,4],H10:[4,11,3],H11:[5,0,6],H12:[5,6,6],
MIDNIGHT:[6,0,8],IN:[6,9,2],THE:[6,12,3],MORNING:[7,0,7],AFTERNOON:[7,7,9],EVENING:[8,0,7],NIGHT:[8,7,5]};
const grid=document.getElementById('grid'),cells=[];
ROWS.forEach((r,y)=>{cells[y]=[];[...r].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;grid.appendChild(s);cells[y].push(s)})});
function words(d){
  let h=d.getHours(),m=Math.round(d.getMinutes()/10)*10;
  if(m===60){m=0;h=(h+1)%24}
  const out=['IT','IS'];
  if(m)out.push('M'+m,'PAST');
  if(h===0){out.push('MIDNIGHT');return out}
  out.push('H'+(h%12||12),'IN','THE',h>=5&&h<12?'MORNING':h<17&&h>=12?'AFTERNOON':h>=17&&h<21?'EVENING':'NIGHT');
  return out;
}
function tick(){
  const d=new Date(),on=words(d);
  cells.flat().forEach(c=>c.classList.remove('on'));
  on.forEach(k=>{const[y,x,n]=W[k];for(let i=0;i<n;i++)cells[y][x+i].classList.add('on')});
  document.getElementById('readout').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
}
tick();setInterval(tick,1000);
// Slow-drifting colour blobs behind the glass; a new palette every 20 seconds
const cv=document.getElementById('bg'),cx=cv.getContext('2d');let hue=Math.random()*360,blobs=[];
function palette(){hue=(hue+137)%360;const c1=`hsl(${hue} 90% 60%)`,c2=`hsl(${(hue+180)%360} 90% 60%)`;
  document.documentElement.style.setProperty('--c1',c1);document.documentElement.style.setProperty('--c2',c2);
  blobs=[0,1,2,3].map(i=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0008,vy:(Math.random()-.5)*.0008,c:i%2?c2:c1}))}
function size(){cv.width=innerWidth/4;cv.height=innerHeight/4}
function draw(){cx.clearRect(0,0,cv.width,cv.height);const r=Math.max(cv.width,cv.height)*.35;
  blobs.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>1)b.vx*=-1;if(b.y<0||b.y>1)b.vy*=-1;cx.fillStyle=b.c;cx.globalAlpha=.55;cx.beginPath();cx.arc(b.x*cv.width,b.y*cv.height,r,0,7);cx.fill()});
  requestAnimationFrame(draw)}
size();palette();draw();addEventListener('resize',size);setInterval(palette,20000);
</script>
</body>
</html>
