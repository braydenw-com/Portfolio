<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Open+Sans:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#fff;color:#1c1c1c;font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif;display:grid;place-items:center;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;filter:blur(70px);opacity:.5}
.face{position:relative;user-select:none;-webkit-user-select:none;padding:clamp(18px,4vmin,40px);border-radius:28px;background:rgba(255,255,255,.7);border:1px solid #eae8e4;backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(27,77,255,.08)}
.grid{display:grid;grid-template-columns:repeat(16,1fr);gap:clamp(2px,1vmin,10px)}
.grid span{width:clamp(16px,5vmin,48px);aspect-ratio:1;display:grid;place-items:center;font-weight:700;font-size:clamp(11px,3vmin,26px);color:#e4e2de;transition:color .8s,text-shadow .8s,transform .8s}
.grid span.on{color:#1c1c1c;transform:scale(1.08)}
.grid span.on.hl{color:#1b4dff}
.readout{margin-top:clamp(14px,3vmin,24px);text-align:center;font-size:clamp(12px,2vmin,15px);letter-spacing:.14em;text-transform:uppercase;color:#767676;font-family:'Open Sans',Arial,sans-serif}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font:400 13px 'Open Sans',Arial,sans-serif;color:#767676}
.grid span:hover{color:#1b4dff}
.grid span.wave{animation:wave .7s ease}
@keyframes wave{40%{transform:translateY(-8px);color:#1b4dff}}
.face.scrub{box-shadow:0 0 0 2px #1b4dff,0 30px 80px rgba(27,77,255,.15)}
.back{position:fixed;top:16px;left:16px;color:#5c5c5c;font-family:'Open Sans',Arial,sans-serif;text-decoration:none;font-size:14px;z-index:2}
.back:hover{color:#1b4dff}
@media (prefers-reduced-motion:reduce){.grid span{transition:none}}
</style>
<style>
.pswitch{position:fixed;z-index:50;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid #eae8e4;backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(28,28,28,.08);font:600 13px/1 'Open Sans','Helvetica Neue',Arial,sans-serif}
.pswitch a{color:#5c5c5c;text-decoration:none;padding:8px 11px;border-radius:999px;white-space:nowrap}
.pswitch a:hover{color:#1b4dff;background:#f2f4ff}
.pswitch a[aria-current]{background:#1b4dff;color:#fff}
.pswitch .sep{width:1px;height:18px;background:#eae8e4;margin:0 2px}
@media (max-width:520px){.pswitch .lbl{display:none}}
</style>
</head>
<body>
<nav class="pswitch" aria-label="Class projects"><a href="../../uxdg-320/index.html">← <span class="lbl">All projects</span></a><span class="sep"></span><a href="../../coding-class/modern/index.html" title="Landing page">1</a><a href="../../word-clock/modern/index.html" aria-current="page" title="Word clock">2</a><a href="../../audio-visualizer/modern/index.html" title="Audio visualizer">3</a><span class="sep"></span><a href="../index.html">Original</a><a href="../../audio-visualizer/modern/index.html" title="Next: Audio visualizer">→</a></nav>
<canvas id="bg"></canvas>
<div class="face"><div class="grid" id="grid"></div><div class="readout" id="readout"></div></div>
<div class="hint">Drag across the clock to travel through the day. Let go to come back to now.</div>
<script>
const ROWS=["ITAISBTENTWENTYC","THIRTYFORTYFIFTY","PASTDTOETWONEFNI","THREEFOURFIVESIX","SEVENINEIGHTENRE","ELEVENTWELVEBROI","MIDNIGHTIINITHEM","MORNINGAFTERNOON","EVENINGNIGHTEBCT"];
// [row, start column, length]
const W={IT:[0,0,2],IS:[0,3,2],M10:[0,6,3],M20:[0,9,6],M30:[1,0,6],M40:[1,6,5],M50:[1,11,5],PAST:[2,0,4],
H1:[2,10,3],H2:[2,8,3],H3:[3,0,5],H4:[3,5,4],H5:[3,9,4],H6:[3,13,3],H7:[4,0,5],H8:[4,7,5],H9:[4,4,4],H10:[4,11,3],H11:[5,0,6],H12:[5,6,6],
MIDNIGHT:[6,0,8],IN:[6,9,2],THE:[6,12,3],MORNING:[7,0,7],AFTERNOON:[7,7,9],EVENING:[8,0,7],NIGHT:[8,7,5]};
const grid=document.getElementById('grid'),cells=[];
ROWS.forEach((r,y)=>{cells[y]=[];[...r].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;grid.appendChild(s);cells[y].push(s)})});
function words(d){
  let h=d.getHours(),m=Math.round(d.getMinutes()/10)*10;
  if(m===60){m=0;h=(h+1)%24}
  const out=['IT','IS'];
  if(m)out.push('M'+m,'PAST');
  if(h===0){out.push('MIDNIGHT');return out}
  out.push('H'+(h%12||12),'IN','THE',h>=5&&h<12?'MORNING':h<17&&h>=12?'AFTERNOON':h>=17&&h<21?'EVENING':'NIGHT');
  return out;
}
let scrub=null,last='';
function tick(){
  const d=scrub||new Date(),on=words(d),key=on.join();
  if(key!==last){last=key;cells.forEach((row,y)=>row.forEach((c,x)=>{c.classList.remove('wave');void c.offsetWidth;c.style.animationDelay=(x+y)*25+'ms';c.classList.add('wave')}))}
  cells.flat().forEach(c=>c.classList.remove('on'));
  on.forEach(k=>{const[y,x,n]=W[k];for(let i=0;i<n;i++)cells[y][x+i].classList.add('on',...(/^H|MIDNIGHT/.test(k)?['hl']:[]))});
  cells.flat().forEach(c=>c.classList.contains('on')||c.classList.remove('hl'));
  document.getElementById('readout').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
}
tick();setInterval(tick,1000);
// Scrub: horizontal = hour, vertical = minute (the idea from the original's commented-out mouse code)
const face=document.querySelector('.face');
function at(e){const r=face.getBoundingClientRect(),x=Math.min(Math.max((e.clientX-r.left)/r.width,0),.999),y=Math.min(Math.max((e.clientY-r.top)/r.height,0),.999);const d=new Date();d.setHours(Math.floor(x*24),Math.floor(y*60));scrub=d;tick()}
face.addEventListener('pointerdown',e=>{face.setPointerCapture(e.pointerId);face.classList.add('scrub');at(e)});
face.addEventListener('pointermove',e=>{if(face.classList.contains('scrub'))at(e)});
face.addEventListener('pointerup',()=>{face.classList.remove('scrub');scrub=null;tick()});
face.style.touchAction='none';face.style.cursor='ew-resize';
// Slow-drifting colour blobs behind the glass; a new palette every 20 seconds
const cv=document.getElementById('bg'),cx=cv.getContext('2d');let hue=Math.random()*360,blobs=[];
function palette(){hue=(hue+137)%360;const c1='#1b4dff',c2='#9fb4ff';
  document.documentElement.style.setProperty('--c1',c1);document.documentElement.style.setProperty('--c2',c2);
  blobs=[0,1,2,3].map(i=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0008,vy:(Math.random()-.5)*.0008,c:i%2?c2:c1}))}
function size(){cv.width=innerWidth/4;cv.height=innerHeight/4}
function draw(){cx.clearRect(0,0,cv.width,cv.height);const r=Math.max(cv.width,cv.height)*.35;
  blobs.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>1)b.vx*=-1;if(b.y<0||b.y>1)b.vy*=-1;cx.fillStyle=b.c;cx.globalAlpha=.25;cx.beginPath();cx.arc(b.x*cv.width,b.y*cv.height,r,0,7);cx.fill()});
  requestAnimationFrame(draw)}
size();palette();draw();addEventListener('resize',size);setInterval(palette,20000);
</script>
</body>
</html>
