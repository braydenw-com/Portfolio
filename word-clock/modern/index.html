<script type="module">
import * as T from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const THREE={...T,EffectComposer,RenderPass,UnrealBloomPass,OutputPass,RoundedBoxGeometry,RoomEnvironment};
// ─── Word logic (same grid as the class version) ───
const ROWS=["ITAISBTENTWENTYC","THIRTYFORTYFIFTY","PASTDTOETWONEFNI","THREEFOURFIVESIX","SEVENINEIGHTENRE","ELEVENTWELVEBROI","MIDNIGHTIINITHEM","MORNINGAFTERNOON","EVENINGNIGHTEBCT"];
const W={IT:[0,0,2],IS:[0,3,2],M10:[0,6,3],M20:[0,9,6],M30:[1,0,6],M40:[1,6,5],M50:[1,11,5],PAST:[2,0,4],
H1:[2,10,3],H2:[2,8,3],H3:[3,0,5],H4:[3,5,4],H5:[3,9,4],H6:[3,13,3],H7:[4,0,5],H8:[4,7,5],H9:[4,4,4],H10:[4,11,3],H11:[5,0,6],H12:[5,6,6],
MIDNIGHT:[6,0,8],IN:[6,9,2],THE:[6,12,3],MORNING:[7,0,7],AFTERNOON:[7,7,9],EVENING:[8,0,7],NIGHT:[8,7,5]};
function words(h,mm){let m=Math.round(mm/10)*10;if(m===60){m=0;h=(h+1)%24}const o=['IT','IS'];if(m)o.push('M'+m,'PAST');
  if(h===0){o.push('MIDNIGHT');return o}o.push('H'+(h%12||12),'IN','THE',h>=5&&h<12?'MORNING':h>=12&&h<17?'AFTERNOON':h>=17&&h<21?'EVENING':'NIGHT');return o}

// ─── Procedural textures (no image files) ───
function canvasTex(w,h,draw,repeat){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...repeat)}return t}
const rnd=(a,b)=>a+Math.random()*(b-a);
const walnut=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle='#4a2c18';g.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){const y=rnd(0,h),a=rnd(4,40),f=rnd(.002,.01),ph=rnd(0,6);g.strokeStyle=`rgba(${rnd(20,40)|0},${rnd(10,22)|0},${rnd(5,12)|0},${rnd(.08,.3)})`;g.lineWidth=rnd(1,5);g.beginPath();
    for(let x=0;x<=w;x+=8)g.lineTo(x,y+Math.sin(x*f+ph)*a+Math.sin(x*f*3.1)*a*.2);g.stroke()}
  for(let i=0;i<6;i++){const x=rnd(0,w),y=rnd(0,h);for(let r=4;r<60;r+=5){g.strokeStyle='rgba(25,12,5,.18)';g.beginPath();g.ellipse(x,y,r*2.2,r,0,0,7);g.stroke()}}});
const plaster=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle='#d9cfc2';g.fillRect(0,0,w,h);const d=g.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const n=rnd(-14,14);d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n}g.putImageData(d,0,0)},[3,2]);
const plasterBump=canvasTex(512,512,(g,w,h)=>{const d=g.createImageData(w,h);for(let i=0;i<d.data.length;i+=4){const n=rnd(90,165);d.data[i]=d.data[i+1]=d.data[i+2]=n;d.data[i+3]=255}g.putImageData(d,0,0)},[6,4]);
const planks=canvasTex(1024,1024,(g,w,h)=>{for(let i=0;i<8;i++){const y=i*h/8,base=rnd(70,95);g.fillStyle=`rgb(${base},${base*.62|0},${base*.38|0})`;g.fillRect(0,y,w,h/8);
  for(let k=0;k<40;k++){g.strokeStyle=`rgba(30,15,5,${rnd(.05,.2)})`;g.beginPath();const yy=y+rnd(0,h/8);g.moveTo(0,yy);g.bezierCurveTo(w*.3,yy+rnd(-6,6),w*.6,yy+rnd(-6,6),w,yy+rnd(-4,4));g.stroke()}
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,y,w,3);g.fillRect(rnd(0,w),y,3,h/8)}},[4,4]);

// The face: letters drawn to a canvas. The same canvas drives the colour map and the glow (emissive) map.
const CELL=128,face=document.createElement('canvas');face.width=16*CELL;face.height=9*CELL;
const fg=face.getContext('2d'),faceTex=new THREE.CanvasTexture(face);faceTex.colorSpace=THREE.SRGBColorSpace;faceTex.anisotropy=8;
const glowC=document.createElement('canvas');glowC.width=face.width;glowC.height=face.height;const gg=glowC.getContext('2d');const glowTex=new THREE.CanvasTexture(glowC);glowTex.colorSpace=THREE.SRGBColorSpace;
let led='#ffb35c';
function paintFace(lit){
  fg.fillStyle='#070708';fg.fillRect(0,0,face.width,face.height);
  gg.fillStyle='#000';gg.fillRect(0,0,glowC.width,glowC.height);
  fg.font=gg.font=`700 ${CELL*.56}px "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif`;fg.textAlign=gg.textAlign='center';fg.textBaseline=gg.textBaseline='middle';
  ROWS.forEach((r,y)=>[...r].forEach((ch,x)=>{const cx=(x+.5)*CELL,cy=(y+.5)*CELL,on=lit.has(y*16+x);
    fg.fillStyle=on?led:'#2a2826';fg.fillText(ch,cx,cy);
    if(on){gg.shadowColor=led;gg.shadowBlur=10;gg.fillStyle=led;gg.fillText(ch,cx,cy);gg.shadowBlur=0}}));
  faceTex.needsUpdate=glowTex.needsUpdate=true;
}

// ─── Scene ───
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);const envTex=pmrem.fromScene(new THREE.RoomEnvironment(),.04).texture; // reflections for the clock only, so the room stays lit by its own lights
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.05,50);

// Room: back wall, floor, a window on the left wall with sky behind it
const wallMat=new THREE.MeshStandardMaterial({map:plaster,bumpMap:plasterBump,bumpScale:.004,roughness:.95});
const wall=new THREE.Mesh(new THREE.PlaneGeometry(8,4.5),wallMat);wall.position.set(0,1.25,0);wall.receiveShadow=true;scene.add(wall);
const side=new THREE.Mesh(new THREE.PlaneGeometry(6,4.5),wallMat.clone());side.rotation.y=Math.PI/2;side.position.set(-2.2,1.25,2.5);side.receiveShadow=true;scene.add(side);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,6),new THREE.MeshStandardMaterial({map:planks,roughness:.55,metalness:0}));floor.rotation.x=-Math.PI/2;floor.position.set(0,-1,3);floor.receiveShadow=true;scene.add(floor);
const sky=new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.5),new THREE.MeshBasicMaterial({color:'#9fd0ff'}));sky.rotation.y=Math.PI/2;sky.position.set(-2.19,1.2,1.4);scene.add(sky);
const frameMat=new THREE.MeshStandardMaterial({color:'#3a2a1c',roughness:.7});
[[1.2,.06,0,.78],[1.2,.06,0,-.78],[.06,1.6,.58,0],[.06,1.6,-.58,0],[1.2,.04,0,0],[.04,1.6,0,0]].forEach(([w,h,z,y])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.06,h,w),frameMat);m.position.set(-2.17,1.2+y,1.4+z);m.castShadow=true;scene.add(m)});

// Lights: hemisphere fill, sun through the window (casts the clock's shadow), and a warm table lamp for the evening
const hemi=new THREE.HemisphereLight('#cfe3ff','#3a2a1c',.35);scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff3dd',2);sun.position.set(-4,2.6,2.2);sun.target.position.set(0,.2,0);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-3;sun.shadow.camera.right=3;sun.shadow.camera.top=3;sun.shadow.camera.bottom=-3;sun.shadow.bias=-.0004;sun.shadow.radius=6;
const lamp=new THREE.PointLight('#ffb36b',0,0,1.6);lamp.position.set(1.6,-.2,1.2);lamp.castShadow=true;lamp.shadow.mapSize.set(1024,1024);scene.add(lamp);
// The lamp itself: a fabric shade on a brass stem, sitting on a small side table
const shade=new THREE.Mesh(new THREE.CylinderGeometry(.16,.24,.3,48,1,true),new THREE.MeshStandardMaterial({color:'#efe3cf',emissive:'#ffb36b',emissiveIntensity:0,side:THREE.DoubleSide,roughness:1}));shade.position.set(1.6,-.15,1.2);scene.add(shade);
const brass=new THREE.MeshStandardMaterial({color:'#b08a4a',metalness:1,roughness:.3,envMap:envTex,envMapIntensity:.6});
const stem=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.5,16),brass);stem.position.set(1.6,-.5,1.2);stem.castShadow=true;scene.add(stem);
const table=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.04,48),new THREE.MeshStandardMaterial({map:walnut,roughness:.4}));table.position.set(1.6,-.75,1.2);table.castShadow=table.receiveShadow=true;scene.add(table);
const leg=new THREE.Mesh(new THREE.CylinderGeometry(.03,.05,.25,16),brass);leg.position.set(1.6,-.88,1.2);scene.add(leg);

// The clock: rounded walnut case, recessed face, glass front, a wire to a nail
const clock=new THREE.Group();clock.position.set(0,.35,.06);scene.add(clock);
const CW=1.5,CH=.92,CD=.09;
const caseMesh=new THREE.Mesh(new THREE.RoundedBoxGeometry(CW,CH,CD,6,.03),new THREE.MeshPhysicalMaterial({map:walnut,roughness:.35,clearcoat:1,clearcoatRoughness:.18,envMap:envTex,envMapIntensity:.5}));
caseMesh.castShadow=true;caseMesh.receiveShadow=true;clock.add(caseMesh);
const FW=CW-.14,FH=FW*9/16;
const faceMesh=new THREE.Mesh(new THREE.PlaneGeometry(FW,FH),new THREE.MeshStandardMaterial({map:faceTex,emissive:'#ffffff',emissiveMap:glowTex,emissiveIntensity:1.5,roughness:.35}));
faceMesh.position.set(0,.03,CD/2+.002);clock.add(faceMesh);
const glass=new THREE.Mesh(new THREE.PlaneGeometry(FW,FH),new THREE.MeshPhysicalMaterial({color:'#ffffff',metalness:0,roughness:.04,transmission:1,thickness:.004,ior:1.5,transparent:true,opacity:1,envMap:envTex,envMapIntensity:.8,specularIntensity:1}));
glass.position.set(0,.03,CD/2+.012);clock.add(glass);
const plaque=new THREE.Mesh(new THREE.BoxGeometry(.32,.05,.006),brass);plaque.position.set(0,-CH/2+.045,CD/2+.003);clock.add(plaque);
const nail=new THREE.Mesh(new THREE.SphereGeometry(.012,16,16),brass);nail.position.set(0,CH/2+.28,.01);clock.add(nail);
[-1,1].forEach(s=>{const a=new THREE.Vector3(s*CW*.3,CH/2-.02,-.02),b=new THREE.Vector3(0,CH/2+.28,0);const wire=new THREE.Mesh(new THREE.CylinderGeometry(.002,.002,a.distanceTo(b),6),new THREE.MeshStandardMaterial({color:'#999',metalness:1,roughness:.4}));wire.position.copy(a).add(b).multiplyScalar(.5);wire.lookAt(b);wire.rotateX(Math.PI/2);clock.add(wire)});

// Bloom makes the lit letters glow like real LEDs behind glass
const composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.45,.35,.9);composer.addPass(bloom);
composer.addPass(new THREE.OutputPass());

// ─── Time of day → lighting ───
// [hour, sky, sun colour, sun strength, sun height, hemi strength, lamp strength, exposure, led]
const KEYS=[[0,'#0a1030',"#9fb4ff",.15,.4,.08,1.6,.9,'#9fc2ff'],[6,'#ffb38a','#ffb36b',1.2,.6,.25,.5,1,'#ffb35c'],[9,'#9fd0ff','#fff1d6',2.4,2.2,.4,0,1.1,'#ffe9b0'],
  [13,'#7ec3ff','#fffaf0',2.6,3.4,.45,0,1.1,'#fff3cc'],[17,'#ffc38a','#ffa05c',2,1.4,.35,.2,1.05,'#ffb35c'],[19.5,'#d97a6a','#ff6a3c',.9,.5,.2,1.2,1,'#ffc07a'],[22,'#1b2148','#8fa5ff',.2,.4,.1,1.8,.9,'#ffcf8a'],[24,'#0a1030',"#9fb4ff",.15,.4,.08,1.6,.9,'#9fc2ff']];
const C=new THREE.Color(),C2=new THREE.Color();
const lerpC=(a,b,t)=>C.set(a).lerp(C2.set(b),t).getStyle();
function light(h){let i=0;while(KEYS[i+1][0]<=h)i++;const a=KEYS[i],b=KEYS[i+1],t=(h-a[0])/(b[0]-a[0]),L=(k)=>a[k]+(b[k]-a[k])*t;
  sky.material.color.set(lerpC(a[1],b[1],t));sun.color.set(lerpC(a[2],b[2],t));sun.intensity=L(3)*2.2;sun.position.y=L(4);
  hemi.intensity=L(5)*3;lamp.intensity=L(6)*6;shade.material.emissiveIntensity=L(6)*.6;renderer.toneMappingExposure=L(7);
  const nl=lerpC(a[8],b[8],t);if(nl!==led){led=nl;return true}return false}

// ─── Clock state, controls and sound (same behaviour as before) ───
let override=null,last='',playing=null,ac,tickOn=false;
function click(f,v){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.05)}
function update(){const d=new Date(),h=override??(d.getHours()+d.getMinutes()/60),H=Math.floor(h)%24,M=Math.floor((h%1)*60);
  const ledChanged=light(h%24),on=words(H,M),key=on.join();
  if(key!==last||ledChanged){if(key!==last&&tickOn)click(180,.25);last=key;const lit=new Set();on.forEach(k=>{const[y,x,n]=W[k];for(let i=0;i<n;i++)lit.add(y*16+x+i)});paintFace(lit)}
  document.getElementById('readout').textContent=(H%12||12)+':'+String(M).padStart(2,'0')+(H<12?' AM':' PM')}
setInterval(()=>{if(tickOn&&!playing)click(1800,.05);if(!playing)update()},1000);
document.getElementById('tick').onclick=e=>{ac=ac||new AudioContext();ac.resume();tickOn=!tickOn;e.target.setAttribute('aria-pressed',tickOn)};
document.getElementById('now').onclick=()=>{stop();override=null;update()};
function stop(){cancelAnimationFrame(playing);playing=null;document.getElementById('play').textContent='▶ Play a day in 20 seconds'}
document.getElementById('play').onclick=()=>{if(playing){stop();return}const s=performance.now(),h0=override??new Date().getHours();document.getElementById('play').textContent='❚❚ Pause';
  const step=t=>{override=(h0+(t-s)/20000*24)%24;update();playing=requestAnimationFrame(step)};playing=requestAnimationFrame(step)};
// Drag horizontally anywhere on the scene to scrub through the day; the camera also drifts with the pointer
let dragging=false,px=0,py=0;const el=renderer.domElement;el.style.touchAction='none';el.style.cursor='ew-resize';
const at=e=>{override=Math.min(Math.max(e.clientX/innerWidth,0),.999)*24;update()};
el.addEventListener('pointerdown',e=>{stop();dragging=true;el.setPointerCapture(e.pointerId);at(e)});
el.addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5;if(dragging)at(e)});
el.addEventListener('pointerup',()=>dragging=false);

function resize(){const a=innerWidth/innerHeight;camera.aspect=a;camera.fov=a<1?52:34;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);resize();
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cam=new THREE.Vector3(.15,.3,3.7);
(function loop(t){
  const z=innerWidth<innerHeight?5.2:3.7;
  const tx=still?0:px*.6+Math.sin(t*.00015)*.12,ty=still?.3:.3-py*.3;
  cam.x+=(tx-cam.x)*.04;cam.y+=(ty-cam.y)*.04;cam.z+=(z-cam.z)*.04;
  camera.position.copy(cam);camera.lookAt(0,.3,0);
  clock.rotation.z=still?0:Math.sin(t*.0007)*.004; // the faintest sway on its wire
  composer.render();requestAnimationFrame(loop)})(0);
update();
document.fonts&&document.fonts.ready.then(()=>{last='';update()});
</script>

b.onclick=()=>{on=!on;b.setAttribute('aria-pressed',on);if(on&&!c.querySelector('iframe').src)c.querySelector('iframe').src='../index.html';c.hidden=!on;set(innerWidth/2)};
h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);const mv=ev=>set(ev.clientX);h.addEventListener('pointermove',mv);h.addEventListener('pointerup',()=>h.removeEventListener('pointermove',mv),{once:true})});})();
</script>
